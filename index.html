
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web2Static</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101114;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
}
.app {
  width: 100%;
  max-width: 580px;
  background: #191a20;
  border: 1px solid #30313a;
  border-radius: 16px;
  padding: 28px;
}
h1 { margin: 0 0 8px; font-size: 27px; }
p { color: #a5a6b0; line-height: 1.5; }
input {
  width: 100%;
  padding: 14px;
  background: #101114;
  border: 1px solid #383943;
  border-radius: 9px;
  color: white;
  margin: 14px 0;
}
button {
  padding: 13px 17px;
  background: #fff;
  color: #111;
  border: 0;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .5; cursor: wait; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions button { flex: 1; }
#status {
  margin-top: 18px;
  padding: 12px;
  background: #111217;
  border-radius: 8px;
  font-size: 13px;
  color: #b8bac5;
  white-space: pre-wrap;
}
small { color: #777985; display: block; margin-top: 16px; }
</style>
</head>
<body>
<main class="app">
  <h1>Web2Static</h1>
  <p>Convert authorized websites into portable HTML and SVG files.</p>

  <input id="url" type="url" placeholder="https://example.com">

  <button id="convert">Convert website</button>

  <div id="status">Waiting for a website URL...</div>

  <div class="actions" style="margin-top:14px">
    <button id="html" disabled>Download HTML</button>
    <button id="svg" disabled>Download SVG</button>
  </div>

  <small>Some websites prevent browser-based fetching. Only convert content you own or are authorized to archive.</small>
</main>

<script>
const $ = id => document.getElementById(id);

let htmlOutput = "";
let svgOutput = "";

function download(content, filename, type) {
  const blob = new Blob([content], {type});
  const link = document.createElement("a");
  const objectURL = URL.createObjectURL(blob);
  link.href = objectURL;
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(objectURL), 1000);
}

function safeName(value) {
  return value.toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "") || "website";
}

function makeSVG(title, description) {
  const escape = value => value.replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&apos;"
  })[c]);

  return `<svg xmlns="http://www.w3.org/2000/svg"
    width="900" height="500" viewBox="0 0 900 500">
    <rect width="900" height="500" fill="#17181e"/>
    <text x="55" y="100" fill="white"
      font-size="38" font-family="Arial">${escape(title)}</text>
    <foreignObject x="55" y="140" width="790" height="300">
      <div xmlns="http://www.w3.org/1999/xhtml"
        style="font:20px Arial;color:#bbb;line-height:1.6">
        ${escape(description)}
      </div>
    </foreignObject>
  </svg>`;
}

function cleanSVG(svg) {
  const copy = svg.cloneNode(true);
  copy.querySelectorAll(
    "script,foreignObject,iframe,object,embed"
  ).forEach(el => el.remove());

  copy.querySelectorAll("*").forEach(el => {
    [...el.attributes].forEach(attr => {
      if (/^on/i.test(attr.name) ||
          /javascript:/i.test(attr.value)) {
        el.removeAttribute(attr.name);
      }
    });
  });

  copy.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  return new XMLSerializer().serializeToString(copy);
}

$("convert").addEventListener("click", async () => {
  const raw = $("url").value.trim();

  $("html").disabled = true;
  $("svg").disabled = true;
  htmlOutput = "";
  svgOutput = "";

  let target;
  try {
    target = new URL(raw);
    if (!["http:", "https:"].includes(target.protocol))
      throw new Error();
  } catch {
    $("status").textContent = "Enter a valid HTTP or HTTPS URL.";
    return;
  }

  $("convert").disabled = true;
  $("status").textContent = "Fetching website...";

  try {
    const response = await fetch(target.href, {
      mode: "cors",
      redirect: "follow"
    });

    if (!response.ok) throw new Error("HTTP " + response.status);

    const source = await response.text();
    const doc = new DOMParser().parseFromString(source, "text/html");

    const title = doc.title || target.hostname;

    doc.querySelectorAll(
      "script,iframe,object,embed,form,base,meta[http-equiv]"
    ).forEach(el => el.remove());

    doc.querySelectorAll("link[rel=stylesheet],style").forEach(el => el.remove());

    doc.querySelectorAll("*").forEach(el => {
      [...el.attributes].forEach(attr => {
        if (/^on/i.test(attr.name) ||
            /javascript:/i.test(attr.value)) {
          el.removeAttribute(attr.name);
        }
      });
    });

    doc.querySelectorAll("[src], [href]").forEach(el => {
      for (const attr of ["src", "href"]) {
        const value = el.getAttribute(attr);
        if (!value || value.startsWith("#")) continue;
        try {
          const absolute = new URL(value, response.url);
          if (["http:", "https:"].includes(absolute.protocol)) {
            el.setAttribute(attr, absolute.href);
          } else {
            el.removeAttribute(attr);
          }
        } catch {
          el.removeAttribute(attr);
        }
      }
    });

    const content = doc.body.innerHTML;
    const safeTitle = title.replace(/[&<>"]/g, "");

    htmlOutput = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${safeTitle}</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;
margin:40px auto;padding:20px;line-height:1.6;color:#222}
img{max-width:100%;height:auto}
</style>
</head>
<body>
<h1>${safeTitle}</h1>
${content}
</body>
</html>`;

    const firstSVG = doc.querySelector("svg");

    if (firstSVG) {
      svgOutput = cleanSVG(firstSVG);
    } else {
      const description = (doc.body.innerText || "")
        .replace(/\s+/g, " ").trim().slice(0, 350);
      svgOutput = makeSVG(title, description);
    }

    $("html").disabled = false;
    $("svg").disabled = false;
    $("status").textContent =
      "Conversion complete!\n" +
      "HTML: Ready\n" +
      "SVG: Ready\n" +
      "Source: " + response.url;

  } catch (error) {
    $("status").textContent =
      "Conversion failed.\n\n" +
      "The website may block browser access through CORS, " +
      "require authentication, or be unavailable.\n\n" +
      "Details: " + error.message;
  } finally {
    $("convert").disabled = false;
  }
});

$("html").addEventListener("click", () => {
  download(htmlOutput, "website.html", "text/html");
});

$("svg").addEventListener("click", () => {
  download(svgOutput, "website.svg", "image/svg+xml");
});
</script>
</body>
</html>
